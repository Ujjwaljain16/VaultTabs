# docker-compose.prod.yml
#
# Production overrides. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Changes from the base file:
#   - Postgres is NOT published on the host at all (reachable only inside the compose network)
#   - Restart always
#   - Resource limits
#
# Requires Docker Compose v2.24+ (uses the !reset YAML tag to clear the inherited port mapping;
# a plain `ports: []` override does NOT remove ports inherited from the base file).
# Put a TLS-terminating reverse proxy in front of backend (3000) and pwa (3001).

services:

  postgres:
    restart: always
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  backend:
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  pwa:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  cleanup:
    restart: always
