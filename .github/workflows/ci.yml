name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  # npm 10.9 crashes while resolving this workspace tree ("reading 'edgesOut'"), so CI uses npm 11.
  NPM_VERSION: 11
  # Dummy public URLs: CI only checks that the apps build.
  NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
  VITE_API_URL: https://api.example.com/api/v1
  VITE_DASHBOARD_URL: https://vault.example.com
  VITE_FIREFOX_EXTENSION_ID: vaulttabs@example.com
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      # `typecheck` builds shared first, then type-checks every workspace.
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaulttabs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vaulttabs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vaulttabs_test
      DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - name: Build shared
        run: npm run build:shared
      - name: Build backend
        run: npm run build --workspace=backend
      - name: Build PWA
        run: npm run build --workspace=pwa
      - name: Build extension (Chrome)
        run: npm run zip --workspace=extension
      - name: Build extension (Firefox)
        run: npm run zip:firefox --workspace=extension
      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.sha }}
          path: extension/.output/*.zip
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [backend, pwa]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Locate Dockerfile
        id: dockerfile
        run: echo "path=$(ls ${{ matrix.app }}/[Dd]ockerfile | head -n1)" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.app }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
